name: Nexa Remote release

on:
  workflow_dispatch:
  push:
    tags: ['nexa-v*']

permissions:
  # The Android job publishes the unsigned APK to the tagged GitHub release.
  contents: write

jobs:
  upstream-build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}

